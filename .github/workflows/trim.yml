name: Trim old reports

on:
  push:
    branches:
      # So that we can test this action easily:
      - "**/*trim-action*"
  workflow_dispatch:
  schedule:
    # Run at 3:03am on the 3rd of the month
    - cron: "3 3 3 * *"

defaults:
  run:
    shell: bash

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}"
  cancel-in-progress: true

jobs:
  trim:
    name: "Trim stored data"
    runs-on: ubuntu-latest

    permissions:
      id-token: write       # needed for git push

    steps:
      - name: "Check out repo"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Remove old reports"
        run: |
          ls -1d reports/$(date -d "3 months ago" +%Y%m)* | xargs git rm -r
          git config user.name 'Ned Batchelder'
          git config user.email 'ned@nedbatchelder.com'
          git commit -m 'trim reports older than two months'
          git push
